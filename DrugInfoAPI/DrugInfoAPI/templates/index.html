<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Information Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { padding-top: 50px; }
        .result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Drug Information Search</h1>
        <div class="row">
            <div class="col-md-6">
                <form id="searchForm">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="drugName" placeholder="Enter drug name (e.g. aspirin)">
                        <button class="btn btn-primary" type="submit">Search</button>
                    </div>
                </form>
            </div>
        </div>
        <div id="results" class="result"></div>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const drugName = document.getElementById('drugName').value;
            const results = document.getElementById('results');

            try {
                const response = await fetch(`/api/v1/drug?name=${encodeURIComponent(drugName)}`);
                const data = await response.json();

                if (data.status === 'success') {
                    results.innerHTML = `
                        <div class="card">
                            <div class="card-body">
                                <h2 class="mb-4">${drugName.toUpperCase()}</h2>
                                <div class="alert alert-success">Status: ${data.status}</div>
                                
                                <div class="card mb-4">
                                    <div class="card-header bg-primary text-white">
                                        <h4 class="mb-0">OpenFDA Information</h4>
                                    </div>
                                    <div class="card-body">
                                        <h5>Brand Name</h5>
                                        <p>${data.openfda_data.brand_name}</p>
                                        
                                        <h5>Generic Name</h5>
                                        <p>${data.openfda_data.generic_name}</p>
                                        
                                        <h5>Manufacturer</h5>
                                        <p>${data.openfda_data.manufacturer}</p>
                                        
                                        <h5>Indications (Uses)</h5>
                                        <p>${data.openfda_data.indications}</p>
                                        
                                        <h5>Dosage</h5>
                                        <p>${data.openfda_data.dosage}</p>
                                        
                                        <h5>Warnings</h5>
                                        <div class="alert alert-warning">
                                            ${data.openfda_data.warnings}
                                        </div>
                                    </div>
                                </div>

                                <div class="card">
                                    <div class="card-header bg-info text-white">
                                        <h4 class="mb-0">PubChem Information</h4>
                                    </div>
                                    <div class="card-body">
                                        <h5>Title</h5>
                                        <p>${data.pubchem_data.title}</p>
                                        
                                        <h5>CID</h5>
                                        <p>${data.pubchem_data.cid}</p>
                                        
                                        <h5>Description</h5>
                                        <p>${data.pubchem_data.description}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    results.innerHTML = `<div class="alert alert-danger">Error: ${data.message}</div>`;
                }
            } catch (error) {
                results.innerHTML = `<div class="alert alert-danger">Error searching for drug information</div>`;
            }
        });
    </script>
</body>
</html>
