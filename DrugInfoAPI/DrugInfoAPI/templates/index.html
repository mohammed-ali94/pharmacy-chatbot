<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Information Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { padding-top: 50px; }
        .result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Drug Information Search</h1>
        <div class="row">
            <div class="col-md-6">
                <form id="searchForm">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="drugName" placeholder="Enter drug name (e.g. aspirin)">
                        <button class="btn btn-primary" type="submit">Search</button>
                    </div>
                </form>
            </div>
        </div>
        <div id="results" class="result"></div>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const drugName = document.getElementById('drugName').value;
            const results = document.getElementById('results');

            try {
                const response = await fetch(`/api/v1/drug?name=${encodeURIComponent(drugName)}`);
                const data = await response.json();

                if (data.status === 'success') {
                    results.innerHTML = `
                        <div class="card">
                            <div class="card-body">
                                <h3>${drugName.toUpperCase()}</h3>
                                <p><strong>Status:</strong> ${data.status}</p>
                                <h4>OpenFDA Data:</h4>
                                <pre>${JSON.stringify(data.openfda_data, null, 2)}</pre>
                                <h4>PubChem Data:</h4>
                                <pre>${JSON.stringify(data.pubchem_data, null, 2)}</pre>
                            </div>
                        </div>
                    `;
                } else {
                    results.innerHTML = `<div class="alert alert-danger">Error: ${data.message}</div>`;
                }
            } catch (error) {
                results.innerHTML = `<div class="alert alert-danger">Error searching for drug information</div>`;
            }
        });
    </script>
</body>
</html>
