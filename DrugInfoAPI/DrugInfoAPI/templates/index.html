<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Information Search</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .search-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
        }
        .search-box {
            max-width: 600px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <!-- Logo -->
        <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V5C21 3.89543 20.1046 3 19 3Z" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>

        <!-- Search Section -->
        <div class="search-box">
            <div class="input-group mb-3">
                <input type="text" class="form-control form-control-lg" id="drugName" placeholder="Enter drug name (e.g., aspirin)" aria-label="Drug name">
                <button class="btn btn-primary" type="button" onclick="searchDrug()">Search</button>
            </div>
        </div>

        <!-- Results Card (initially hidden) -->
        <div id="resultCard" class="card d-none w-100 mt-4" style="max-width: 800px;">
            <div class="card-body">
                <h3 id="drugTitle" class="card-title mb-3"></h3>
                <h6 id="genericName" class="card-subtitle mb-3 text-muted"></h6>
                <div id="drugClass" class="mb-3"></div>
                <p id="description" class="card-text mb-4"></p>

                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">Common Uses</h5>
                                <ul id="commonUses" class="list-group list-group-flush"></ul>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">Typical Dosage</h5>
                                <ul id="typicalDosage" class="list-group list-group-flush"></ul>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">Side Effects</h5>
                                <ul id="sideEffects" class="list-group list-group-flush"></ul>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title text-warning">Important Warnings</h5>
                                <ul id="warnings" class="list-group list-group-flush"></ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
</body>
</html>
